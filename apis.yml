description: 'City Reach International Limited was a UK-registered telecommunications and
  internet-infrastructure company, incorporated 14 April 2000 at 8 Salisbury Square, Blackfriars,
  London EC4Y 8BB (Companies House number 03973748), classified under SIC 6420 (telecommunications)
  and 7260 (other computer related activities). It was a dot-com era venture backed in part by
  Battery Ventures, and appears on the Battery Ventures all-companies list, which is how it entered
  the API Evangelist network. The company was dissolved on 13 May 2014. Enrichment probing in July
  2026 found no surviving corporate website, developer portal, documentation, or API surface: the
  candidate domains cityreach.com, cityreachinternational.com, cityreach.net and
  cityreachinternational.co.uk do not resolve, and cityreach.co.uk resolves only to a parked
  domain-for-sale landing page. There is no API, specification, SDK, or event surface to catalog for
  this company, and none should be fabricated.'
